name: tests

# Runs on every push and every pull request. A branch push additionally gets the
# MySQL leg, because the two drivers disagree often enough to be worth both on
# anything that could reach main.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same ref makes an in-flight run irrelevant. `cancel-in-progress`
# is safe here because the suite has no side effects outside its own database.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · sqlite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lowest supported version and the current one. A suite that only ever
        # runs on the newest PHP hides every deprecation until the next major.
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Pinned explicitly rather than relying on `.env`. `phpunit.xml`'s `<env>`
      # entries only reach PHPUNIT — they are not read by Artisan — so an unpinned
      # `migrate:fresh` here would migrate whatever the runner's `.env` points at.
      - name: Point the tooling at SQLite
        run: |
          echo "DB_CONNECTION=sqlite" >> "$GITHUB_ENV"
          echo "DB_DATABASE=database/testing.sqlite" >> "$GITHUB_ENV"
          touch database/testing.sqlite

      # The suite builds its own schema with RefreshDatabase, so a fresh migration is
      # run here as an explicit gate: if `migrate:fresh` cannot build the schema from
      # nothing, that is a failure in its own right, not something to discover as a
      # wall of test errors.
      - name: Verify a clean migration
        run: php artisan migrate:fresh --force

      - name: Check the generated OpenAPI document is current
        run: php artisan api:openapi --check

      # `--stop-on-skipped`: a skip is a finding, not a way to make the suite green.
      # A test that cannot run must be made to run or deleted, and either way a human
      # decides — silently passing over it is how a suite stops meaning anything.
      - name: Run the test suite
        run: vendor/bin/phpunit --stop-on-skipped --stop-on-incomplete

  mysql:
    name: PHP ${{ matrix.php }} · mysql
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: worksphere_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-mysql-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-mysql-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # The suite runs against SQLite by default (phpunit.xml sets DB_CONNECTION and
      # an in-memory database). Pointing those at MySQL exercises the migrations and
      # the queries for real: ENUM columns, index lengths, `alter` paths and the
      # CHECK constraints SQLite quietly does not have all differ, and a suite that
      # only ever runs on SQLite is a suite that has never met production.
      #
      # Env vars are exported into the job rather than written into phpunit.xml,
      # because `<env>` in that file does NOT override a variable already present in
      # the environment — and the environment is exactly how this switch is made.
      - name: Point the suite at MySQL
        run: |
          echo "DB_CONNECTION=mysql" >> "$GITHUB_ENV"
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=3306" >> "$GITHUB_ENV"
          echo "DB_DATABASE=worksphere_test" >> "$GITHUB_ENV"
          echo "DB_USERNAME=root" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=root" >> "$GITHUB_ENV"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if php -r 'exit(@new mysqli("127.0.0.1", "root", "root", "worksphere_test") ? 0 : 1);'; then
              echo "MySQL is up."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become available in time."
          exit 1

      - name: Verify a clean migration
        run: php artisan migrate:fresh --force

      - name: Run the test suite
        run: vendor/bin/phpunit --stop-on-skipped --stop-on-incomplete

# NOTE ON FORMATTING
#
# There is deliberately no `pint --test` job here. `vendor/bin/pint --test`
# currently reports 99 pre-existing unformatted files, none of them touched by the
# phases that built this workflow. Adding the gate now would make every push red
# for a debt that predates it, and "fix 99 files in the same commit that adds CI"
# is a review nobody reads. The gate belongs in its own commit, once the tree is
# clean; until then this workflow would be reporting on tests rather than on
# formatting, which is what it claims to do.